name: RAVIO free-staging checks

on:
  push:
    branches:
      - "staging/**"
  pull_request:
    branches:
      - main
      - "staging/**"

permissions:
  contents: read

concurrency:
  group: ravio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend install, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run typecheck

      - name: Production build
        run: bun run build
