name: RAVIO free-staging checks

on:
  push:
    branches:
      - "staging/**"
  pull_request:
    branches:
      - main
      - "staging/**"

permissions:
  contents: read

concurrency:
  group: ravio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend install, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
